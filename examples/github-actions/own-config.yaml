# Use your own cuppa.yaml from the repo instead of action inputs.
# The config decides everything (targets, categories, messages, private packs).
# Keep webhooks out of the file: write ${SLACK_WEBHOOK} in cuppa.yaml and pass
# the secret in "env" below.
name: Watercooler

on:
  schedule:
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kashifkhan0771/cuppa@v1
        with:
          config: cuppa.yaml
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
