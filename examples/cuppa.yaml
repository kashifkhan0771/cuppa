# Example cuppa config. Every key is optional except targets
# (and targets only matter for "cuppa post").
# Secrets come from environment variables with ${NAME}.
version: 1

schedule:
  # when "cuppa daemon" posts: minute hour day-of-month month day-of-week
  # (numbers only; day of week 0-7, 0 and 7 are Sunday). Here: 10:00 Mon-Fri
  cron: "0 10 * * 1-5"
  # the clock the cron line follows, and whose midnight starts a new day
  # in daily mode; empty means the computer's own
  timezone: Asia/Karachi
  skip_weekends: false
  # holidays: no post on these days
  skip_dates: ["2026-12-25"]

selection:
  # daily: same question for everyone with the same seed, no saved state
  # random: any question each time
  # no-repeat: never repeat until every question was used
  mode: no-repeat
  seed: team-alpha
  categories: [icebreakers, this-or-that]
  tags: []
  exclude_tags: []
  # safe fits any workplace; casual adds lighter questions
  sfw: safe
  locale: en

data:
  # your own questions, same format as the files in questions/
  extra_questions: []

history:
  path: ~/.local/state/cuppa/history.json

# Go templates. .Bold writes bold the way each chat app expects it
# (*x* in Slack and Google Chat, **x** in the others).
message:
  template: "☕ {{ .Bold \"Today's watercooler:\" }} {{ .Text }}"
  poll_template: "☕ {{ .Bold \"Today's watercooler:\" }} {{ .Text }}\n{{ range $i, $o := .Options }}{{ index $.Emojis $i }} {{ $o }}\n{{ end }}"

targets:
  - name: team-slack
    type: slack
    webhook: ${SLACK_WEBHOOK}

  - name: eng-gchat
    type: gchat
    webhook: ${GCHAT_WEBHOOK}

  # a Workflows webhook ("Send webhook alerts to a channel")
  - name: ops-teams
    type: teams
    webhook: ${TEAMS_WEBHOOK}

  - name: community-discord
    type: discord
    webhook: ${DISCORD_WEBHOOK}

  - name: dev-mattermost
    type: mattermost
    webhook: ${MATTERMOST_WEBHOOK}

  # Webex has no webhooks: a bot posts into a space it was added to
  - name: sales-webex
    type: webex
    token: ${WEBEX_TOKEN}
    room_id: ${WEBEX_ROOM_ID}

  # any other service: you choose the method, headers and body
  - name: my-bot
    type: webhook
    url: ${MY_BOT_URL}
    method: POST
    headers:
      Authorization: Bearer ${MY_BOT_TOKEN}
    body: '{"content": {{ json .Rendered }}, "question_id": {{ json .Question.ID }}}'

# "cuppa serve": the HTTP API
server:
  # only this computer can reach it; use 0.0.0.0:8080 to open it up
  addr: 127.0.0.1:8080
  # needed for POST /v1/post and GET /v1/questions/next
  token: ${CUPPA_TOKEN}
  # browser sites allowed to call the API ("*" for any)
  cors_origins: []
