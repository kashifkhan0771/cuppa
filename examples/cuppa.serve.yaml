# For "cuppa serve": your own small HTTP API. Run: cuppa serve --config cuppa.serve.yaml
# GET endpoints are open. POST /v1/post and GET /v1/questions/next need the token:
#   curl -H "Authorization: Bearer $CUPPA_TOKEN" localhost:8080/v1/questions/next
version: 1
selection:
  mode: daily
  seed: my-team
server:
  addr: 127.0.0.1:8080
  token: ${CUPPA_TOKEN}
  # websites allowed to call the API from a browser ("*" for any)
  cors_origins: ["https://intranet.example.com"]
targets:
  - name: team-slack
    type: slack
    webhook: ${SLACK_WEBHOOK}
