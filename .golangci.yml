version: "2"

linters:
  # default "standard" set: errcheck, govet, ineffassign, staticcheck, unused
  # plus a few extras that catch real bugs without much noise
  enable:
    - errorlint
    - gosec
    - misspell

  exclusions:
    # skip the usual false alarms, like unchecked fmt.Fprintln and Close
    presets:
      - std-error-handling
    rules:
      # tests read and write temp files on purpose
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
