name: Question checks

on:
  pull_request:
    paths:
      - questions/**
      - schema/**
      - internal/tools/datagen/**
      - pkg/cuppa/**

# read-only on purpose: works the same for PRs from forks
permissions:
  contents: read

jobs:
  questions:
    name: Questions follow the rules (format, duplicates, blocked words)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the base branch, to compare questions against
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # checks every question, new and old, against schema/blocklist.txt
      # and the other rules
      - name: Check questions
        run: go run ./internal/tools/datagen check

      # show added/changed/removed questions on the run page,
      # even when the check above failed
      - name: Summarize question changes
        if: always()
        run: go run ./internal/tools/datagen diff -base base/questions >> "$GITHUB_STEP_SUMMARY"
