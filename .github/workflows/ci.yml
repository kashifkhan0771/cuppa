name: Code checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a new push to the same PR cancels the older, now pointless run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # runs go vet, gofmt, gosec and the rest of .golangci.yml,
      # with the version pinned in the Makefile
      - name: Run golangci-lint
        run: make lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build all packages
        run: go build ./...

  tests:
    name: Tests and coverage (above 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests and check coverage
        run: make cover

  tests-other-systems:
    name: Tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # no race detector here; it runs on Linux above
      - name: Run tests
        run: go test ./...

  security:
    name: Known security issues (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check dependencies and Go version
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  tidy:
    name: Repo is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

      # the binary embeds dist/, so it must match questions/
      - name: dist/ matches the questions
        run: |
          make build-data
          # porcelain also lists new files that git diff would miss
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "dist/ is out of date: run 'make build-data' and commit the result"
            exit 1
          fi

      # the npm and Python packages embed a copy of dist/
      - name: Package copies match dist/
        run: |
          make sync-packages
          if [ -n "$(git status --porcelain -- packages)" ]; then
            git status --short -- packages
            echo "package copies are out of date: run 'make sync-packages' and commit the result"
            exit 1
          fi

      - name: No long dashes
        run: make check-dashes

  secrets:
    name: No leaked secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # every commit, so a secret hidden in the middle of a PR is found
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # --redact keeps the secret itself out of the public log;
      # the version is pinned in the Makefile
      - name: Scan history and files
        run: make secrets

  npm-package:
    name: npm package works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # builds ESM and CommonJS, then runs the tests with the shared daily() vectors
      - name: Build and test
        working-directory: packages/npm
        run: |
          npm ci
          npm test

  python-package:
    name: Python package works (${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests with the shared daily() vectors
        working-directory: packages/python
        run: PYTHONPATH=src python -m unittest discover -s tests

  release-build:
    name: Release build works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # every binary and archive, nothing published; Docker images are
      # only built in the real release
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean --skip=docker

  action:
    name: GitHub Action works (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cuppa
        uses: ./
        with:
          slack_webhook: https://hooks.slack.com/services/not/a/real/hook
          categories: this-or-that
          dry_run: "true"
      - name: Outputs are set
        env:
          ID: ${{ steps.cuppa.outputs.question_id }}
          TEXT: ${{ steps.cuppa.outputs.question_text }}
        run: |
          echo "picked $ID: $TEXT"
          case "$ID" in
            tot-*) ;;
            *) echo "expected a this-or-that question id, got '$ID'"; exit 1 ;;
          esac
          test -n "$TEXT"
