name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # use the Go version written in go.mod
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

      - name: test
        run: go test -race ./...

      # the binary embeds dist/, so it must match questions/
      - name: dist is up to date
        run: |
          make build-data
          # porcelain also lists new files that git diff would miss
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "dist/ is out of date: run 'make build-data' and commit the result"
            exit 1
          fi
